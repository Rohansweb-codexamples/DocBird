<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>DocBird Editor</title>

<link rel="stylesheet" href="styles.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700;800&family=Merriweather:wght@400;700&family=Roboto+Mono:wght@400;600&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0" rel="stylesheet">

<style>

/* =========================================================
   DOCBIRD EDITOR
   Editor-specific styling
   ========================================================= */

:root{
    --orange:#ff8a00;
    --orange2:#ffb300;
    --yellow:#ffd54a;

    --editor-bg:#eef1f5;
    --paper:#ffffff;

    --text:#202124;
    --muted:#687078;

    --line:#dfe3e8;

    --toolbar:#ffffff;

    --page-width:850px;
    --page-height:1100px;

    --zoom:1;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:var(--editor-bg);
    color:var(--text);
    overflow:hidden;
}

/* =========================================================
   MATERIAL ICONS
   ========================================================= */

.material-symbols-outlined{
    font-family:'Material Symbols Outlined';
    font-weight:normal;
    font-style:normal;
    font-size:22px;
    line-height:1;
    letter-spacing:normal;
    text-transform:none;
    display:inline-block;
    white-space:nowrap;
    word-wrap:normal;
    direction:ltr;
    -webkit-font-feature-settings:'liga';
    -webkit-font-smoothing:antialiased;
}

/* =========================================================
   TOP BAR
   ========================================================= */

.topbar{
    height:64px;
    background:#fff;
    border-bottom:1px solid #ddd;
    display:flex;
    align-items:center;
    padding:0 14px;
    gap:12px;
    position:relative;
    z-index:1000;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:170px;
}

.brand-mark{
    width:40px;
    height:40px;
    border-radius:13px;

    background:
    linear-gradient(
        135deg,
        var(--orange),
        var(--yellow)
    );

    display:flex;
    align-items:center;
    justify-content:center;

    color:white;

    font-size:21px;
    font-weight:900;

    box-shadow:
    0 5px 15px rgba(255,138,0,.25);
}

.brand-name{
    font-size:20px;
    font-weight:800;
    color:#333;
}

.document-title{
    border:0;
    outline:0;
    background:transparent;
    font-size:17px;
    font-weight:600;
    width:260px;
    padding:9px 10px;
    border-radius:9px;
}

.document-title:hover,
.document-title:focus{
    background:#f4f5f6;
}

.top-actions{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:7px;
}

/* =========================================================
   BUTTONS
   ========================================================= */

.icon-button{
    width:40px;
    height:40px;

    border:0;
    border-radius:10px;

    background:transparent;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    color:#4d5358;

    transition:
        background .15s,
        transform .15s;
}

.icon-button:hover{
    background:#f1f3f4;
}

.icon-button:active{
    transform:scale(.94);
}

.icon-button.active{
    background:#fff0d7;
    color:#e66f00;
    box-shadow:
        inset 0 0 0 2px #ff9d2e;
}

.primary-button{
    border:0;

    background:
    linear-gradient(
        135deg,
        var(--orange),
        var(--orange2)
    );

    color:white;

    border-radius:12px;

    padding:11px 18px;

    font-weight:700;

    display:flex;
    align-items:center;
    gap:8px;

    cursor:pointer;

    box-shadow:
    0 5px 16px rgba(255,138,0,.25);
}

.primary-button:hover{
    transform:translateY(-1px);
}

/* =========================================================
   TOOLBAR
   ========================================================= */

.toolbar{
    min-height:58px;

    background:var(--toolbar);

    border-bottom:1px solid #d9dde1;

    display:flex;
    align-items:center;

    gap:4px;

    padding:
        8px
        12px;

    position:relative;

    z-index:900;

    overflow-x:auto;
}

.toolbar::-webkit-scrollbar{
    height:6px;
}

.toolbar::-webkit-scrollbar-thumb{
    background:#d0d4d8;
    border-radius:10px;
}

.toolbar-group{
    display:flex;
    align-items:center;
    gap:3px;
    padding-right:8px;
    margin-right:4px;
    border-right:1px solid #e0e3e6;
}

.toolbar-group:last-child{
    border-right:0;
}

.tool{
    min-width:38px;
    height:38px;

    border:0;
    border-radius:8px;

    background:transparent;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    color:#41464b;

    position:relative;
}

.tool:hover{
    background:#f1f3f4;
}

.tool.active{
    background:#ffe9c7;
    color:#d96300;

    box-shadow:
        inset 0 0 0 2px #ff9d2e;
}

.tool .material-symbols-outlined{
    font-size:21px;
}

/* =========================================================
   SELECTS
   ========================================================= */

.select{
    height:38px;

    border:1px solid #d9dde2;

    background:#fff;

    border-radius:8px;

    padding:0 9px;

    font-family:inherit;
    font-size:14px;

    outline:none;

    cursor:pointer;
}

.select:hover,
.select:focus{
    border-color:var(--orange);
}

/* =========================================================
   COLOR PICKERS
   ========================================================= */

.color-button{
    width:38px;
    height:38px;

    border:0;

    background:transparent;

    border-radius:8px;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.color-preview{
    width:20px;
    height:4px;
    border-radius:3px;
    background:#202124;
}

.highlight-preview{
    background:#fff36b;
}

/* =========================================================
   EDITOR AREA
   ========================================================= */

.editor-area{
    height:calc(100vh - 122px);

    overflow:auto;

    padding:
        55px
        30px
        140px;

    position:relative;
}

/* =========================================================
   PAGE WRAPPER
   ========================================================= */

.page-wrap{
    width:calc(var(--page-width) * var(--zoom));
    margin:0 auto;
}

/* =========================================================
   DOCUMENT PAGE
   ========================================================= */

.document-page{

    width:var(--page-width);

    min-height:var(--page-height);

    transform-origin:top left;

    transform:scale(var(--zoom));

    background:white;

    margin:0 auto;

    padding:
        82px
        82px
        100px;

    box-shadow:
        0 5px 25px rgba(0,0,0,.15);

    border-radius:3px;

    outline:none;

    font-family:Inter,Arial,sans-serif;

    font-size:16px;

    line-height:1.75;

    color:#202124;

    position:relative;
}

/* =========================================================
   NORMAL RULED PAPER
   ========================================================= */

.document-page.ruled{

    background-color:#fff;

    background-image:
        repeating-linear-gradient(
            to bottom,

            transparent 0px,
            transparent 31px,

            #c9dff5 31px,
            #c9dff5 32px
        );

    background-position:
        0 12px;

    background-size:
        100% 32px;
}

/* Make text sit nicely on ruled paper */

.document-page.ruled{
    line-height:32px;
}

/* =========================================================
   LEFT RED MARGIN
   ========================================================= */

.document-page.ruled.margin-line::before{

    content:"";

    position:absolute;

    top:0;
    bottom:0;

    left:78px;

    width:1px;

    background:#f3a3a3;

    pointer-events:none;
}

/* =========================================================
   MATHS GRID
   ========================================================= */

.document-page.math-grid{

    background-color:#fff;

    background-image:

        linear-gradient(
            #b9d4ee 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            #b9d4ee 1px,
            transparent 1px
        );

    background-size:
        24px 24px;

    background-position:
        0 0;
}

/* Larger maths grid */

.document-page.math-grid.large-grid{

    background-image:

        linear-gradient(
            #8fb9df 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            #8fb9df 1px,
            transparent 1px
        );

    background-size:
        48px 48px;
}

/* =========================================================
   NEWSPAPER MODE
   ========================================================= */

.document-page.newspaper{

    font-family:
        Merriweather,
        Georgia,
        serif;

    line-height:1.55;
}

.document-page.newspaper .article-content{

    column-count:2;

    column-gap:42px;

    column-rule:
        1px solid #ccc;
}

/* =========================================================
   EDITABLE ELEMENTS
   ========================================================= */

.document-page p{
    margin:
        0 0 12px;
}

.document-page h1{
    font-family:
        Playfair Display,
        Georgia,
        serif;

    font-size:42px;

    line-height:1.2;

    margin:
        20px 0;
}

.document-page h2{
    font-size:32px;
}

.document-page h3{
    font-size:26px;
}

.document-page h4{
    font-size:22px;
}

.document-page h5{
    font-size:19px;
}

.document-page h6{
    font-size:17px;
}

.document-page blockquote{

    border-left:
        5px solid var(--orange);

    padding-left:20px;

    margin:
        20px 0;

    color:#60666b;

    font-style:italic;
}

/* =========================================================
   TABLES
   ========================================================= */

.document-page table{

    border-collapse:collapse;

    width:100%;

    margin:
        18px 0;
}

.document-page td,
.document-page th{

    border:
        1px solid #cfd4d9;

    padding:
        9px;

    min-width:70px;
}

/* =========================================================
   MATH BLOCK
   ========================================================= */

.math-block{

    display:inline-flex;

    align-items:center;

    gap:8px;

    padding:
        8px 12px;

    margin:
        4px;

    border:
        2px solid #333;

    background:white;

    font-family:
        "Times New Roman",
        serif;

    font-size:20px;

    border-radius:4px;

    cursor:text;
}

.math-fraction{

    display:inline-flex;

    flex-direction:column;

    text-align:center;

    vertical-align:middle;

}

.math-fraction .top{

    border-bottom:
        1px solid #222;

    padding:
        0 7px 2px;
}

.math-fraction .bottom{

    padding:
        2px 7px 0;
}

/* =========================================================
   DRAWING / OBJECTS
   ========================================================= */

.draggable-object{

    position:relative;

    display:inline-block;

    user-select:none;

    cursor:move;

    outline:2px solid transparent;
}

.draggable-object.selected{

    outline:
        2px solid var(--orange);
}

/* =========================================================
   STATUS BAR
   ========================================================= */

.statusbar{

    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:38px;

    background:white;

    border-top:
        1px solid #d8dce0;

    display:flex;

    align-items:center;

    padding:
        0 16px;

    gap:20px;

    font-size:12px;

    color:#626970;

    z-index:1000;
}

.status-right{

    margin-left:auto;

    display:flex;

    gap:16px;

    align-items:center;
}

/* =========================================================
   PANELS
   ========================================================= */

.panel{

    position:fixed;

    right:18px;

    top:135px;

    width:340px;

    max-height:
        calc(100vh - 180px);

    overflow:auto;

    background:white;

    border:
        1px solid #ddd;

    border-radius:18px;

    box-shadow:
        0 15px 45px rgba(0,0,0,.2);

    z-index:1500;

    display:none;
}

.panel.open{
    display:block;
}

.panel-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        16px 18px;

    border-bottom:
        1px solid #eee;

    font-weight:800;
}

.panel-body{
    padding:18px;
}

.setting{

    margin-bottom:18px;
}

.setting label{

    display:block;

    font-size:13px;

    font-weight:700;

    margin-bottom:7px;
}

.setting-row{

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;
}

/* =========================================================
   SWITCHES
   ========================================================= */

.switch{

    width:48px;
    height:27px;

    background:#d9dde1;

    border-radius:20px;

    padding:3px;

    cursor:pointer;

    transition:.2s;
}

.switch span{

    display:block;

    width:21px;
    height:21px;

    background:white;

    border-radius:50%;

    box-shadow:
        0 2px 5px rgba(0,0,0,.2);

    transition:.2s;
}

.switch.on{

    background:var(--orange);
}

.switch.on span{

    transform:
        translateX(21px);
}

/* =========================================================
   FIND BAR
   ========================================================= */

.find-bar{

    position:fixed;

    top:135px;

    left:50%;

    transform:
        translateX(-50%);

    background:white;

    border:
        1px solid #ddd;

    border-radius:14px;

    box-shadow:
        0 10px 35px rgba(0,0,0,.18);

    padding:10px;

    display:none;

    z-index:1600;

    gap:6px;

    align-items:center;
}

.find-bar.open{
    display:flex;
}

.find-bar input{

    width:250px;

    border:
        1px solid #ddd;

    border-radius:8px;

    padding:9px;

    outline:none;
}

/* =========================================================
   PRESENT MODE
   ========================================================= */

body.present-mode{

    background:#000;

}

body.present-mode .topbar,
body.present-mode .toolbar,
body.present-mode .statusbar{

    display:none;
}

body.present-mode .editor-area{

    height:100vh;

    padding:40px;

    display:flex;

    justify-content:center;

    align-items:flex-start;

    overflow:auto;
}

body.present-mode .document-page{

    box-shadow:
        0 0 80px rgba(255,255,255,.1);
}

/* =========================================================
   FOCUS MODE
   ========================================================= */

body.focus-mode .topbar,
body.focus-mode .toolbar,
body.focus-mode .statusbar{

    display:none;
}

body.focus-mode .editor-area{

    height:100vh;

    padding-top:70px;
}

/* =========================================================
   DARK MODE
   ========================================================= */

body.dark-editor{

    --editor-bg:#17191c;
}

body.dark-editor .topbar,
body.dark-editor .toolbar,
body.dark-editor .statusbar,
body.dark-editor .panel{

    background:#24272b;

    color:#f4f4f4;

    border-color:#3a3e43;
}

body.dark-editor .document-page{

    background:#202327;

    color:#f5f5f5;
}

body.dark-editor .document-page.ruled{

    background-color:#202327;

    background-image:
        repeating-linear-gradient(
            to bottom,
            transparent 0,
            transparent 31px,
            #394b60 31px,
            #394b60 32px
        );
}

body.dark-editor .document-page.math-grid{

    background-color:#202327;

    background-image:
        linear-gradient(
            #394b60 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            #394b60 1px,
            transparent 1px
        );
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:900px){

    .brand-name{
        display:none;
    }

    .document-title{
        width:160px;
    }

    .editor-area{
        padding:
            25px 8px 100px;
    }

    .page-wrap{
        width:100%;
    }

    .document-page{

        width:
            min(850px,100%);

        min-height:
            1000px;

        padding:
            45px 30px 70px;

        transform:none;
    }

    .panel{
        left:10px;
        right:10px;
        width:auto;
    }

}

/* =========================================================
   PRINT
   ========================================================= */

@media print{

    body{
        background:white !important;
    }

    .topbar,
    .toolbar,
    .statusbar,
    .panel,
    .find-bar{
        display:none !important;
    }

    .editor-area{
        padding:0 !important;
        overflow:visible !important;
    }

    .document-page{
        box-shadow:none !important;
        margin:0 !important;
        width:100% !important;
        transform:none !important;
    }

}

</style>
</head>

<body>

<!-- =======================================================
     TOP BAR
     ======================================================= -->

<header class="topbar">

    <div class="brand">

        <div class="brand-mark">
            D
        </div>

        <div class="brand-name">
            DocBird
        </div>

    </div>

    <button
        class="icon-button"
        title="Back to dashboard"
        onclick="goDashboard()">

        <span class="material-symbols-outlined">
            arrow_back
        </span>

    </button>

    <input
        id="documentTitle"
        class="document-title"
        value="Untitled Document"
        aria-label="Document title">

    <div class="top-actions">

        <button
            class="icon-button"
            id="undoButton"
            title="Undo"
            onclick="runCommand('undo')">

            <span class="material-symbols-outlined">
                undo
            </span>

        </button>

        <button
            class="icon-button"
            id="redoButton"
            title="Redo"
            onclick="runCommand('redo')">

            <span class="material-symbols-outlined">
                redo
            </span>

        </button>

        <button
            class="icon-button"
            title="Find"
            onclick="toggleFind()">

            <span class="material-symbols-outlined">
                search
            </span>

        </button>

        <button
            class="icon-button"
            id="fullscreenButton"
            title="Fullscreen"
            onclick="toggleFullscreen()">

            <span class="material-symbols-outlined">
                fullscreen
            </span>

        </button>

        <button
            class="primary-button"
            onclick="saveDocument()">

            <span class="material-symbols-outlined">
                save
            </span>

            Save

        </button>

    </div>

</header>


<!-- =======================================================
     TOOLBAR
     ======================================================= -->

<nav class="toolbar" id="toolbar">

    <!-- History -->

    <div class="toolbar-group">

        <button
            class="tool"
            title="Undo"
            onclick="runCommand('undo')">

            <span class="material-symbols-outlined">
                undo
            </span>

        </button>

        <button
            class="tool"
            title="Redo"
            onclick="runCommand('redo')">

            <span class="material-symbols-outlined">
                redo
            </span>

        </button>

    </div>


    <!-- Style -->

    <div class="toolbar-group">

        <select
            class="select"
            id="formatSelect"
            onchange="formatBlock(this.value)">

            <option value="p">
                Normal text
            </option>

            <option value="h1">
                Heading 1
            </option>

            <option value="h2">
                Heading 2
            </option>

            <option value="h3">
                Heading 3
            </option>

            <option value="h4">
                Heading 4
            </option>

            <option value="h5">
                Heading 5
            </option>

            <option value="h6">
                Heading 6
            </option>

            <option value="blockquote">
                Quote
            </option>

        </select>


        <select
            class="select"
            id="fontSelect"
            onchange="changeFont(this.value)">

            <option value="Inter">
                Inter
            </option>

            <option value="Poppins">
                Poppins
            </option>

            <option value="Arial">
                Arial
            </option>

            <option value="Georgia">
                Georgia
            </option>

            <option value="Merriweather">
                Merriweather
            </option>

            <option value="Playfair Display">
                Playfair Display
            </option>

            <option value="Roboto Mono">
                Roboto Mono
            </option>

        </select>


        <select
            class="select"
            id="sizeSelect"
            onchange="changeFontSize(this.value)">

            <option value="1">
                10
            </option>

            <option value="2">
                12
            </option>

            <option value="3"
                    selected>
                16
            </option>

            <option value="4">
                18
            </option>

            <option value="5">
                24
            </option>

            <option value="6">
                32
            </option>

            <option value="7">
                48
            </option>

        </select>

    </div>


    <!-- Text formatting -->

    <div class="toolbar-group">

        <button
            class="tool command-button"
            data-command="bold"
            title="Bold"
            onclick="runCommand('bold')">

            <b>B</b>

        </button>

        <button
            class="tool command-button"
            data-command="italic"
            title="Italic"
            onclick="runCommand('italic')">

            <i>I</i>

        </button>

        <button
            class="tool command-button"
            data-command="underline"
            title="Underline"
            onclick="runCommand('underline')">

            <u>U</u>

        </button>

        <button
            class="tool command-button"
            data-command="strikeThrough"
            title="Strikethrough"
            onclick="runCommand('strikeThrough')">

            <span class="material-symbols-outlined">
                strikethrough_s
            </span>

        </button>

        <button
            class="tool command-button"
            data-command="superscript"
            title="Superscript"
            onclick="runCommand('superscript')">

            x²

        </button>

        <button
            class="tool command-button"
            data-command="subscript"
            title="Subscript"
            onclick="runCommand('subscript')">

            x₂

        </button>

    </div>


    <!-- Colours -->

    <div class="toolbar-group">

        <button
            class="color-button"
            title="Text colour"
            onclick="chooseTextColor()">

            <span class="material-symbols-outlined">
                format_color_text
            </span>

            <span
                class="color-preview"
                id="textColorPreview">
            </span>

        </button>

        <button
            class="color-button"
            title="Highlight"
            onclick="chooseHighlight()">

            <span class="material-symbols-outlined">
                ink_highlighter
            </span>

            <span
                class="color-preview highlight-preview">
            </span>

        </button>

        <input
            type="color"
            id="textColor"

<script>

/* =========================================================
   DOCBIRD EDITOR ENGINE
   ========================================================= */

const page =
    document.getElementById("documentPage");

const article =
    document.getElementById("articleContent");

const titleInput =
    document.getElementById("documentTitle");

let currentDocId =
    localStorage.getItem("currentDoc");

let zoom =
    1;

let savedSelection =
    null;


/* =========================================================
   DOCUMENT STORAGE
   ========================================================= */

function getDocuments(){

    try{

        return JSON.parse(
            localStorage.getItem("docbird_docs") || "[]"
        );

    }catch{

        return [];

    }

}


function saveDocuments(docs){

    localStorage.setItem(
        "docbird_docs",
        JSON.stringify(docs)
    );

}


/* =========================================================
   LOAD DOCUMENT
   ========================================================= */

function loadDocument(){

    const docs =
        getDocuments();

    if(!currentDocId){

        currentDocId =
            String(Date.now());

        localStorage.setItem(
            "currentDoc",
            currentDocId
        );

        docs.push({

            id:currentDocId,

            title:"Untitled Document",

            content:article.innerHTML,

            date:new Date().toLocaleString()

        });

        saveDocuments(docs);

    }

    const doc =
        docs.find(
            d=>String(d.id)===String(currentDocId)
        );

    if(doc){

        titleInput.value =
            doc.title || "Untitled Document";

        article.innerHTML =
            doc.content ||
            "<p>Start writing...</p>";

    }

    updateStats();

}


loadDocument();


/* =========================================================
   SAVE
   ========================================================= */

function saveDocument(){

    const docs =
        getDocuments();

    let doc =
        docs.find(
            d=>String(d.id)===String(currentDocId)
        );

    if(!doc){

        doc = {

            id:currentDocId,

            title:"Untitled Document",

            content:"",

            date:""

        };

        docs.push(doc);

    }

    doc.title =
        titleInput.value.trim()
        || "Untitled Document";

    doc.content =
        article.innerHTML;

    doc.date =
        new Date().toLocaleString();

    saveDocuments(docs);

    document.getElementById("saveStatus")
        .textContent="Saved";

}


let saveTimer;

function scheduleSave(){

    document.getElementById("saveStatus")
        .textContent="Saving...";

    clearTimeout(saveTimer);

    saveTimer =
        setTimeout(
            saveDocument,
            700
        );

}


article.addEventListener(
    "input",
    ()=>{
        updateStats();
        scheduleSave();
    }
);


titleInput.addEventListener(
    "input",
    scheduleSave
);


/* =========================================================
   COMMAND SYSTEM
   ========================================================= */

function focusEditor(){

    page.focus();

}


function runCommand(command,value=null){

    focusEditor();

    try{

        document.execCommand(
            command,
            false,
            value
        );

    }catch(e){

        console.log(e);

    }

    updateToolbar();

    updateStats();

    scheduleSave();

}


/* =========================================================
   FORMAT
   ========================================================= */

function formatBlock(tag){

    focusEditor();

    document.execCommand(
        "formatBlock",
        false,
        tag
    );

    updateToolbar();

    scheduleSave();

}


/* =========================================================
   FONT
   ========================================================= */

function changeFont(font){

    focusEditor();

    document.execCommand(
        "fontName",
        false,
        font
    );

    scheduleSave();

}


function changeFontSize(size){

    focusEditor();

    document.execCommand(
        "fontSize",
        false,
        size
    );

    scheduleSave();

}


/* =========================================================
   TEXT COLOUR
   ========================================================= */

const textColor =
    document.getElementById("textColor");

const highlightColor =
    document.getElementById("highlightColor");


function chooseTextColor(){

    rememberSelection();

    textColor.click();

}


textColor.addEventListener(
    "input",
    ()=>{

        restoreSelection();

        document.execCommand(
            "foreColor",
            false,
            textColor.value
        );

        document.getElementById(
            "textColorPreview"
        ).style.background =
            textColor.value;

        scheduleSave();

    }
);


function chooseHighlight(){

    rememberSelection();

    highlightColor.click();

}


highlightColor.addEventListener(
    "input",
    ()=>{

        restoreSelection();

        document.execCommand(
            "hiliteColor",
            false,
            highlightColor.value
        );

        scheduleSave();

    }
);


/* =========================================================
   SELECTION
   ========================================================= */

function rememberSelection(){

    const selection =
        window.getSelection();

    if(
        selection.rangeCount
        &&
        !selection.isCollapsed
    ){

        savedSelection =
            selection.getRangeAt(0).cloneRange();

    }

}


function restoreSelection(){

    if(!savedSelection)
        return;

    const selection =
        window.getSelection();

    selection.removeAllRanges();

    selection.addRange(
        savedSelection
    );

    focusEditor();

}


/* =========================================================
   LINKS
   ========================================================= */

function insertLink(){

    rememberSelection();

    const url =
        prompt(
            "Enter the web address:"
        );

    if(!url)
        return;

    restoreSelection();

    document.execCommand(
        "createLink",
        false,
        url
    );

    scheduleSave();

}


/* =========================================================
   IMAGE
   ========================================================= */

function insertImage(){

    rememberSelection();

    const url =
        prompt(
            "Enter an image URL:"
        );

    if(!url)
        return;

    restoreSelection();

    document.execCommand(
        "insertImage",
        false,
        url
    );

    scheduleSave();

}


/* =========================================================
   TABLE
   ========================================================= */

function insertTable(){

    rememberSelection();

    const rows =
        Math.max(
            1,
            parseInt(
                prompt(
                    "Number of rows:",
                    "3"
                )
            ) || 3
        );

    const cols =
        Math.max(
            1,
            parseInt(
                prompt(
                    "Number of columns:",
                    "3"
                )
            ) || 3
        );

    restoreSelection();

    let html =
        "<table><tbody>";

    for(let r=0;r<rows;r++){

        html += "<tr>";

        for(let c=0;c<cols;c++){

            html +=
                r===0
                ? "<th>Header</th>"
                : "<td>Cell</td>";

        }

        html += "</tr>";

    }

    html +=
        "</tbody></table><p><br></p>";

    document.execCommand(
        "insertHTML",
        false,
        html
    );

    scheduleSave();

}


/* =========================================================
   MATHS SQUARE
   ========================================================= */

function insertMathSquare(){

    rememberSelection();

    const value =
        prompt(
            "Enter the maths value:",
            "□"
        );

    if(value===null)
        return;

    restoreSelection();

    const html = `

        <span
            class="math-block"
            contenteditable="true">

            ${escapeHTML(value)}

        </span>&nbsp;

    `;

    document.execCommand(
        "insertHTML",
        false,
        html
    );

    scheduleSave();

}


/* =========================================================
   FRACTION
   ========================================================= */

function insertFraction(){

    rememberSelection();

    const top =
        prompt(
            "Numerator:",
            "1"
        );

    if(top===null)
        return;

    const bottom =
        prompt(
            "Denominator:",
            "2"
        );

    if(bottom===null)
        return;

    restoreSelection();

    const html = `

        <span
            class="math-block"
            contenteditable="true">

            <span class="math-fraction">

                <span class="top">
                    ${escapeHTML(top)}
                </span>

                <span class="bottom">
                    ${escapeHTML(bottom)}
                </span>

            </span>

        </span>&nbsp;

    `;

    document.execCommand(
        "insertHTML",
        false,
        html
    );

    scheduleSave();

}


/* =========================================================
   EQUATION
   ========================================================= */

function insertEquation(){

    rememberSelection();

    const equation =
        prompt(
            "Enter an equation:",
            "x² + y² = z²"
        );

    if(equation===null)
        return;

    restoreSelection();

    const html = `

        <span
            class="math-block"
            contenteditable="true">

            ${escapeHTML(equation)}

        </span>&nbsp;

    `;

    document.execCommand(
        "insertHTML",
        false,
        html
    );

    scheduleSave();

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================================
   RULED PAPER
   ========================================================= */

function toggleRuled(){

    page.classList.toggle(
        "ruled"
    );

    page.classList.toggle(
        "margin-line",
        page.classList.contains("ruled")
    );

    const on =
        page.classList.contains("ruled");

    document.getElementById(
        "linesButton"
    ).classList.toggle(
        "active",
        on
    );

    setSwitch(
        "linesSwitch",
        on
    );

    saveViewState();

}


/* =========================================================
   MATH GRID
   ========================================================= */

function toggleMathGrid(){

    page.classList.toggle(
        "math-grid"
    );

    const on =
        page.classList.contains(
            "math-grid"
        );

    document.getElementById(
        "gridButton"
    ).classList.toggle(
        "active",
        on
    );

    setSwitch(
        "gridSwitch",
        on
    );

    saveViewState();

}


/* =========================================================
   NEWSPAPER
   ========================================================= */

function toggleNewspaper(){

    page.classList.toggle(
        "newspaper"
    );

    const on =
        page.classList.contains(
            "newspaper"
        );

    document.getElementById(
        "newspaperButton"
    ).classList.toggle(
        "active",
        on
    );

    setSwitch(
        "newspaperSwitch",
        on
    );

    saveViewState();

}


/* =========================================================
   DARK
   ========================================================= */

function toggleDark(){

    document.body.classList.toggle(
        "dark-editor"
    );

    const on =
        document.body.classList.contains(
            "dark-editor"
        );

    document.getElementById(
        "darkButton"
    ).classList.toggle(
        "active",
        on
    );

    setSwitch(
        "darkSwitch",
        on
    );

    localStorage.setItem(
        "docbird_dark",
        on
    );

}


/* =========================================================
   FOCUS
   ========================================================= */

function toggleFocus(){

    document.body.classList.toggle(
        "focus-mode"
    );

    const on =
        document.body.classList.contains(
            "focus-mode"
        );

    document.getElementById(
        "focusButton"
    ).classList.toggle(
        "active",
        on
    );

    setSwitch(
        "focusSwitch",
        on
    );

}


/* =========================================================
   SWITCH UI
   ========================================================= */

function setSwitch(id,on){

    const element =
        document.getElementById(id);

    if(element){

        element.classList.toggle(
            "on",
            on
        );

    }

}


/* =========================================================
   VIEW STATE
   ========================================================= */

function saveViewState(){

    localStorage.setItem(
        "docbird_ruled",
        page.classList.contains("ruled")
    );

    localStorage.setItem(
        "docbird_grid",
        page.classList.contains("math-grid")
    );

    localStorage.setItem(
        "docbird_newspaper",
        page.classList.contains("newspaper")
    );

}


/* =========================================================
   LOAD VIEW STATE
   ========================================================= */

function loadViewState(){

    if(
        localStorage.getItem(
            "docbird_ruled"
        )==="true"
    ){

        page.classList.add(
            "ruled",
            "margin-line"
        );

    }

    if(
        localStorage.getItem(
            "docbird_grid"
        )==="true"
    ){

        page.classList.add(
            "math-grid"
        );

    }

    if(
        localStorage.getItem(
            "docbird_newspaper"
        )==="true"
    ){

        page.classList.add(
            "newspaper"
        );

    }

    if(
        localStorage.getItem(
            "docbird_dark"
        )==="true"
    ){

        document.body.classList.add(
            "dark-editor"
        );

    }

    updateAllSwitches();

}


function updateAllSwitches(){

    const ruled =
        page.classList.contains("ruled");

    const grid =
        page.classList.contains("math-grid");

    const newspaper =
        page.classList.contains("newspaper");

    const dark =
        document.body.classList.contains(
            "dark-editor"
        );

    const focus =
        document.body.classList.contains(
            "focus-mode"
        );

    document.getElementById(
        "linesButton"
    ).classList.toggle(
        "active",
        ruled
    );

    document.getElementById(
        "gridButton"
    ).classList.toggle(
        "active",
        grid
    );

    document.getElementById(
        "newspaperButton"
    ).classList.toggle(
        "active",
        newspaper
    );

    document.getElementById(
        "darkButton"
    ).classList.toggle(
        "active",
        dark
    );

    document.getElementById(
        "focusButton"
    ).classList.toggle(
        "active",
        focus
    );

    setSwitch(
        "linesSwitch",
        ruled
    );

    setSwitch(
        "gridSwitch",
        grid
    );

    setSwitch(
        "newspaperSwitch",
        newspaper
    );

    setSwitch(
        "darkSwitch",
        dark
    );

    setSwitch(
        "focusSwitch",
        focus
    );

}


loadViewState();


/* =========================================================
   ZOOM
   ========================================================= */

function changeZoom(amount){

    zoom =
        Math.max(
            .5,
            Math.min(
                2,
                zoom + amount
            )
        );

    document.documentElement
        .style
        .setProperty(
            "--zoom",
            zoom
        );

    document.getElementById(
        "zoomLabel"

/* =========================================================
   FIND
   ========================================================= */

function toggleFind(){

    document.getElementById(
        "findBar"
    ).classList.toggle(
        "open"

    if(
        document.getElementById(
            "findBar"
        ).classList.contains("open")

function findNext(){

    const term =
        document.getElementById(
            "findInput"
        ).value;

    if(!term)
        return;

    const walker =
        document.createTreeWalker(
            article,
            NodeFilter.SHOW_TEXT
        );

    let node;

    while(node=walker.nextNode()){

        const index =
            node.textContent
                .toLowerCase()
                .indexOf(
                    term.toLowerCase()
                );

        if(index!==-1){

            const range =
                document.createRange();

            range.setStart(
                node,
                index
            );

            range.setEnd(
                node,
                index + term.length
            );

            const selection =
                window.getSelection();

            selection.removeAllRanges();

            selection.addRange(
                range
            );

            node.parentElement
                .scrollIntoView({
                    behavior:"smooth",
                    block:"center"
                });

            return;

        }

    }

}


function replaceCurrent(){

    const find =
        document.getElementById(
            "findInput"
        ).value;

    const replace =
        document.getElementById(
            "replaceInput"
        ).value;

    if(!find)
        return;

    const walker =
        document.createTreeWalker(
            article,
            NodeFilter.SHOW_TEXT
        );

    let node;

    while(node=walker.nextNode()){

        const index =
            node.textContent
                .toLowerCase()
                .indexOf(
                    find.toLowerCase()
                );

        if(index!==-1){

            node.textContent =
                node.textContent.substring(
                    0,
                    index
                )
                +
                replace
                +
                node.textContent.substring(
                    index + find.length
                );

            scheduleSave();

            return;

        }

    }

}


/* =========================================================
   STATS
   ========================================================= */

function updateStats(){

    const text =
        article.innerText
            .replace(/\s+/g," ")
            .trim();

    const words =
        text
            ? text.split(" ").length
            : 0;

    const chars =
        text.length;

    const minutes =
        Math.max(
            0,
            Math.ceil(
                words / 200
            )
        );

    document.getElementById(
        "wordCount"
    ).textContent =
        words +
        (words===1?" word":" words");

    document.getElementById(
        "charCount"
    ).textContent =
        chars +
        (chars===1
            ?" character"
            :" characters");

    document.getElementById(
        "readingTime"
    ).textContent =
        minutes +
        " min read";

}


/* =========================================================
   TOOLBAR ACTIVE STATES
   ========================================================= */

function updateToolbar(){

    document
        .querySelectorAll(
            ".command-button"
        )
        .forEach(button=>{

            const command =
                button.dataset.command;

            let active=false;

            try{

                active =
                    document.queryCommandState(
                        command
                    );

            }catch{}

            button.classList.toggle(
                "active",
                active
            );

        });

}


/* =========================================================
   SELECTION CHANGE
   ========================================================= */

document.addEventListener(
    "selectionchange",
    ()=>{

        updateToolbar();

    }
);


/* =========================================================
   KEYBOARD SHORTCUTS
   ========================================================= */

document.addEventListener(
    "keydown",
    event=>{

        const ctrl =
            event.ctrlKey ||
            event.metaKey;

        if(!ctrl)
            return;

        const key =
            event.key.toLowerCase();

        if(key==="s"){

            event.preventDefault();

            saveDocument();

        }

        if(key==="b"){

            event.preventDefault();

            runCommand("bold");

        }

        if(key==="i"){

            event.preventDefault();

            runCommand("italic");

        }

        if(key==="u"){

            event.preventDefault();

            runCommand("underline");

        }

        if(key==="f"){

            event.preventDefault();

            toggleFind();

        }

    }
);

/* =========================================================
   DOWNLOAD
   ========================================================= */

function downloadFile(
    filename,
    content,
    type
){

    const blob =
        new Blob(
            [content],
            {type:type}
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href=url;

    link.download=filename;

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);

}
