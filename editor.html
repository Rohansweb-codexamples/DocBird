<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>DocBird Editor</title>

<link rel="stylesheet" href="styles.css">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

</head>

<body>

<div class="editor-shell">

<div class="editor-toolbar">

<button class="tool-btn"
onclick="document.execCommand('bold')">

<b>B</b>

</button>

<button class="tool-btn"
onclick="document.execCommand('italic')">

<i>I</i>

</button>

<button class="tool-btn"
onclick="document.execCommand('underline')">

<u>U</u>

</button>

<button class="tool-btn"
onclick="toggleLines()">

📒

</button>

<button class="tool-btn"
onclick="toggleNewspaper()">

📰

</button>

<button class="tool-btn"
onclick="toggleDark()">

🌙

</button>

<button class="tool-btn"
onclick="saveDoc()">

💾

</button>

</div>

<div id="page"
class="document-page"
contenteditable="true">

Start typing...

</div>

</div>

<script>

const page =
document.getElementById("page");

const docs =
JSON.parse(
localStorage.getItem("docbird_docs")
|| "[]"
);

const current =
localStorage.getItem("currentDoc");

let doc =
docs.find(
d=>String(d.id)===String(current)
);

if(doc){

page.innerHTML =
doc.content || "";

}

function saveDoc(){

if(!doc)return;

doc.content=
page.innerHTML;

localStorage.setItem(
"docbird_docs",
JSON.stringify(docs)
);

}

setInterval(
saveDoc,
2000
);

function toggleLines(){

page.classList.toggle(
"page-lined"
);

}

function toggleNewspaper(){

page.classList.toggle(
"newspaper"
);

}

function toggleDark(){

document.body.classList.toggle(
"dark"
);

}

</script>

</body>
</html>
